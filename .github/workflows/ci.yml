name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
  push:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.ref_name == 'develop' }}

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test (Vitest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build production application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build
        env:
          CI: true
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy-environment:
    name: Deploy ${{ github.ref_name }}
    needs: [lint, test, build]
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/netlify-deploy.yml
    with:
      ci_run_id: ${{ github.run_id }}
      commit_sha: ${{ github.sha }}
      deploy_alias: ${{ github.ref_name == 'main' && '' || github.ref_name }}
      deploy_label: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'develop' && 'development' || 'staging') }}
      deploy_target: ${{ github.ref_name == 'main' && 'production' || 'alias' }}
      environment_name: ${{ github.ref_name == 'main' && 'production' || (github.ref_name == 'develop' && 'development' || 'staging') }}
    secrets: inherit

  release:
    name: Release deployed revision
    needs: deploy-environment
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ci_run_id: ${{ github.run_id }}
      commit_sha: ${{ github.sha }}
